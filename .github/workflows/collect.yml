name: Collect HYPE funding

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 UTC
  workflow_dispatch:       # allows a manual run from the Actions tab

permissions:
  contents: write
  issues: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch funding data
        run: python collect.py

      - name: Ensure alert label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create price-alert -R "$GITHUB_REPOSITORY" -c "#d73a4a" -d "HYPE price level crossed" 2>/dev/null || true

      - name: Price level alert
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ladder.py

      - name: Commit data
        run: |
          git config user.name "funding-bot"
          git config user.email "funding-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
