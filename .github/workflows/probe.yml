name: Probe AF (temporary)

on:
  push:
    branches: [probe]
    paths: ["probe_af.py", ".github/workflows/probe.yml"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python probe_af.py
      - name: Commit probe output
        run: |
          git config user.name "funding-bot"
          git config user.email "funding-bot@users.noreply.github.com"
          git add probe/
          git commit -m "probe output" || echo "nothing"
          git push
